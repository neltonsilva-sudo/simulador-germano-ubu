<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador Hematech · Germano–Ubu</title>
<style>html,body{margin:0;height:100%;background:#0b1622}</style>
<script>/* carregador: busca sempre a versão mais nova do simulador (sem cópia antiga do cache do navegador) */
(function(){var f=function(){location.replace('app.html'+location.search);};
try{fetch('app.html?nc='+Date.now(),{cache:'no-store',credentials:'omit'}).then(function(r){if(!r.ok)throw 0;return r.text();})
.then(function(t){document.open();document.write(t);document.close();}).catch(f);}catch(e){f();}})();
</script></head><body></body></html>
